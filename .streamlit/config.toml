[server]
# ปิด file watcher เพื่อหลีกเลี่ยงปัญหา inotify limit
fileWatcherType = "none"
runOnSave = false

# เพิ่มความเสถียร
maxUploadSize = 1028
maxMessageSize = 200

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#FF6B6B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"
